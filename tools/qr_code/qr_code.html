<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8">
    <title>пингвин</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        #qrcode {
            margin-bottom: 20px;
            display: inline-block;
        }

        .controls {
            margin-top: 20px;
        }

        input,
        button {
            padding: 10px;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <h1>Генериране на QR код</h1>
    <div id="qrcode"></div>

    <div class="controls">
        <input type="text" id="text" placeholder="Въведи текст или линк">
        <button onclick="generateQRCode()">Генерирай</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
    <script>
        function generateQRCode() {
            const container = document.getElementById("qrcode");
            container.innerHTML = ""; // Изчистване на стар QR код
            const text = document.getElementById("text").value;

            new QRCode(container, {
                text: text,
                width: 200,
                height: 200
            });
        }
    </script>
</body>

</html>
