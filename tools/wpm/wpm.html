<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wpm</title>
    <link rel="stylesheet" href="/tools/wpm/wpm.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script src="/tools/wpm/lib/pdf.min.js" type="module"></script>
    <script src="/tools/wpm/lib/pdf.worker.min.js" type="module"></script>
    <script src="/tools/wpm/lib/mammoth.browser.min.js"></script>
</head>
<body>
    <main>
        <div class="controls-bar">
            <div class="file-reset-group">
                <div class="file-input-wrapper">
                    <input type="file" id="fileUpload" accept=".txt,.docx,.pdf">
                    <label for="fileUpload" title="Качи файл (.txt, .docx, .pdf)">⬆️</label>
                </div>
                <button id="resetButton" class="reset-top" title="Нулиране на теста">🔄</button>
            </div>

            <div class="word-count-display">
                <label>Общо думи:</label>
                <span id="wordCountDisplay">0</span>
            </div>

            <div class="timer-input-container">
                <label>Таймер:</label>
                <div class="timer-custom-wrapper" id="timerWrapper">
                    <input type="number" id="minsInput" class="timer-unit-input mins-left-arrows" value="10" min="0" max="60">
                    <span class="timer-separator">:</span>
                    <input type="number" id="secsInput" class="timer-unit-input" value="00" min="0" max="59">
                    <div id="infinityOverlay">∞</div>
                </div>
            </div>
        </div>

        <div class="reference-container" id="referenceContainer">
            <div id="referenceText" class="reference-text"></div>
        </div>

        <div id="textInput" class="typing-input" contenteditable="false" spellcheck="false" tabindex="0"
            data-placeholder="Качете текстов файл, за да започнете."></div>

        <div class="stats-container">
            <h2>📊 Статистика</h2>
            <div class="stats-grid">
                <p>Статус: <span id="testStatus">Очаква се файл...</span></p>
                <p>Скорост (WPM): <span id="wpmCount">0.00</span></p>
                <p>Коректни символи: <span id="correctCharCount">0</span></p>
                <p>Общо въведени символи: <span id="charCount">0</span></p>
                <p>Грешки: <span id="errorCount">0</span></p>
            </div>
            <button id="downloadButton" class="download-btn">Изтегли Резултат</button>
        </div>
    </main>
    <script src="/tools/wpm/wpm.js"></script>
</body>
</html>
