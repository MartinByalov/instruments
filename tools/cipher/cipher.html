<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8">
    <title>乃乇刀のｲﾑｷ尺ﾑﾉり</title>
    <link rel="stylesheet" href="/tools/cipher/cipher.css">

    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            background-color: #000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            font-family: 'Courier New', monospace;
            transition: background 1s ease, opacity 1s ease;
        }

        .fade-out {
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        .message,
        .binary-hint,
        input,
        button,
        a,
        img,
        p {
            transition: opacity 0.8s ease;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div id="content">
        <p>… Там, където все още бушува голямата война — същата, заради която преди няколко века всички митични същества
            изчезнаха от хорската реалност. </p>

        <img src="/tools/cipher/506C61746F.jpg">

        <p><a href="https://en.wikipedia.org/wiki/Voynich_manuscript" target="_blank" style="color: white;">
                🔑 Ръкопис на Войнич</a></p>
        <p><a href="https://bg.wikipedia.org/wiki/%D0%A1%D0%BB%D1%8A%D0%BD%D1%86%D0%B5_%D0%BD%D0%B5%D0%B4%D0%BE%D1%81%D0%B5%D0%B3%D0%B0%D0%B5%D0%BC%D0%BE"
                target="_blank" style="color: white;">
                🔑 Слънце недосегаемо</a></p>
        <p><a href="https://en.wikipedia.org/wiki/Quantum_entanglement" target="_blank" style="color: white;">
                🔑 Стрелочник</a></p>

        <input type="text" id="answerInput" placeholder="What you seek is not outside but inside."
            style="padding: 5px; font-family: monospace; width: 300px;">
        <button onclick="triggerTransition()" style="margin-left: 10px; padding: 5px;">ℵ</button>

        <div class="binary-hint" onclick="copyBinary()">0...</div>
    </div>

    <script>
        function triggerTransition() {
            const input = document.getElementById('answerInput').value.trim().toLowerCase();
            const correct = "what you seek is not outside but inside.";

            if (input === correct) {
                const content = document.getElementById('content');
                content.classList.add('fade-out');

                // След като избледнее съдържанието, сменяме фона и пренасочваме
                setTimeout(() => {
                    document.body.style.backgroundColor = "#0d0d0d";
                    document.body.classList.add('fade-out');

                    setTimeout(() => {
                        window.location.href = "/cipher/enigma.html";
                    }, 1200);
                }, 1500);
            } else {
                alert("Змей... Опитай пак.");
            }
        }

        // (по желание) Бинарният тригер
        let clickCount = 0;
        function copyBinary() {
            clickCount++;
            if (clickCount === 17) {
                alert("⛩️ Порталът се отваря...");
                window.location.href = "/cipher/enigma.html";
            }
        }
    </script>
</body>

</html>
